<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f6f1f5" />
<title>Immersive Message Maker v0.4.2</title>
<style>
:root{color-scheme:light;--bg:#f5f1f4;--panel:rgba(255,255,255,.95);--ink:#2f2930;--muted:#776e75;--line:#e6dce2;--accent:#745668;--soft:#f2e9ef;--danger:#9b4d59;--shadow:0 14px 34px rgba(60,39,52,.08)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top left,#fff 0,transparent 34%),linear-gradient(180deg,#f8f4f7 0%,var(--bg) 100%);color:var(--ink)}button,input,textarea,select{font:inherit}button{touch-action:manipulation}.app-shell{width:min(900px,100%);margin:0 auto;padding:22px 14px calc(42px + env(safe-area-inset-bottom))}.hero{padding:8px 4px 14px}h1{font-size:clamp(1.9rem,7vw,3rem);margin:4px 0 8px;line-height:1.02;letter-spacing:-.04em}h2{margin:2px 0 0;font-size:1.2rem}.subtitle{margin:0;max-width:720px;color:var(--muted);line-height:1.5}.eyebrow{margin:0;text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:800;color:var(--accent)}.panel{background:var(--panel);border:1px solid rgba(231,221,227,.95);box-shadow:var(--shadow);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(10px)}.field-label,label span{display:block;font-size:.84rem;font-weight:760;margin-bottom:7px}label span em{color:var(--muted);font-weight:500}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:12px 13px;outline:none}input:focus,textarea:focus,select:focus{border-color:#b79eae;box-shadow:0 0 0 3px rgba(110,82,101,.11)}textarea{resize:vertical;min-height:76px}.hint{color:var(--muted);font-size:.8rem;margin:8px 0 0;line-height:1.45}.section-heading,.editor-card-top,.button-row,.mini-actions{display:flex;align-items:center;gap:10px}.section-heading,.editor-card-top{justify-content:space-between}.message-list{display:grid;gap:10px;margin:15px 0}.editor-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;display:grid;gap:11px}.separator-editor{background:#fbf8fa}.two-col{display:grid;grid-template-columns:1fr;gap:10px}.three-col{display:grid;grid-template-columns:1fr;gap:10px}.chat-options{margin:15px 0 4px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.toggle-field{border:1px solid var(--line);background:#fbf8fa;border-radius:13px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.toggle-field span{margin:0}.toggle-field input{width:22px;height:22px;padding:0;accent-color:var(--accent)}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}button:active{transform:translateY(1px)}button:disabled{opacity:.38;cursor:default}.secondary-btn,.ghost-btn{background:var(--soft);color:var(--accent)}.ghost-btn{padding:9px 11px;font-size:.82rem}.danger-btn{background:#f8e8ea;color:var(--danger)}.primary-btn{flex:1 1 180px}.button-row{flex-wrap:wrap}.button-row>button{flex:1 1 130px}.segmented{display:inline-flex;padding:3px;border-radius:11px;background:#f1ebef}.segmented button{padding:7px 12px;background:transparent;color:var(--muted);border-radius:9px;font-size:.82rem}.segmented button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(60,39,52,.09)}.icon-btn{width:34px;height:34px;padding:0;display:grid;place-items:center;background:#f5f0f3;color:var(--accent);flex:0 0 auto}.delete-item{color:var(--danger)}.preview-frame{margin-top:14px;background:#dde1e5;border-radius:18px;overflow:hidden;min-height:270px;border:1px solid #d4d9dd;padding:12px}#preview{min-height:246px;display:flex;align-items:flex-start;justify-content:center}.status{min-height:1.25em;color:var(--accent);font-size:.86rem;font-weight:700}details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-size:.86rem}#htmlOutput{margin-top:10px;min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.74rem;line-height:1.45}.empty-state{text-align:center;color:var(--muted);padding:18px 10px;font-size:.9rem}.type-pill{font-size:.72rem;font-weight:800;color:var(--accent);background:var(--soft);padding:5px 8px;border-radius:999px}.hidden-semantic{display:none}.help-chip{display:inline-block;background:#f4edf2;color:#795a6d;border-radius:999px;padding:4px 8px;font-size:.72rem;font-weight:750}
@media(min-width:700px){.app-shell{padding-top:36px}.panel{padding:20px}.two-col{grid-template-columns:1fr 1fr}.three-col{grid-template-columns:repeat(3,1fr)}}
@media(max-width:420px){.mini-actions{gap:6px}.icon-btn{width:32px;height:32px}.stats-grid{grid-template-columns:1fr 1fr 1fr}.preview-frame{padding:8px}}
</style>
</head>
<body>
<main class="app-shell">
<header class="hero"><p class="eyebrow">Tiny RP utility · v0.4.2</p><h1>Immersive Message Maker</h1><p class="subtitle">Build diegetic chat and social UI, preview it live, then copy deterministic self-contained HTML into TauriTavern or SillyTavern.</p></header>
<section class="panel"><label class="field-label" for="preset">Preset</label><select id="preset"><optgroup label="Private chat"><option value="wechat">WeChat</option><option value="imessage">iMessage</option></optgroup><optgroup label="Live"><option value="stream">Stream Chat</option></optgroup><optgroup label="Social"><option value="xpost">X Thread</option></optgroup></select><p id="presetHint" class="hint"></p></section>
<section class="panel editor-panel"><div class="section-heading"><div><p class="eyebrow">Editor</p><h2 id="editorTitle">Messages</h2></div><button id="loadExampleBtn" class="ghost-btn" type="button">Load example</button></div>
<div id="chatEditor">
  <div class="chat-options two-col"><label><span>Chat title <em>optional</em></span><input id="chatTitle" type="text" placeholder="Wei" maxlength="80" /></label><label class="toggle-field"><span>Show app header</span><input id="showHeader" type="checkbox" checked /></label></div>
  <div id="messageList" class="message-list"></div>
  <div class="button-row"><button id="addMessageBtn" type="button">＋ Text</button><button id="addVoiceBtn" class="secondary-btn" type="button">＋ Voice</button><button id="addStickerBtn" class="secondary-btn" type="button">＋ Sticker</button><button id="addSeparatorBtn" class="secondary-btn" type="button">＋ Time</button></div>
  <p id="chatSpecialHint" class="hint"></p>
</div>
<div id="streamEditor" hidden>
  <div class="chat-options two-col"><label><span>Chat title</span><input id="streamTitle" type="text" placeholder="LIVE CHAT" maxlength="80" /></label><label><span>Watching</span><input id="streamViewers" type="number" inputmode="numeric" min="0" step="1" /></label></div>
  <div id="streamList" class="message-list"></div>
  <div class="button-row"><button id="addStreamMessageBtn" type="button">＋ Chat Message</button><button id="addDonationBtn" class="secondary-btn" type="button">＋ Highlighted Donation</button><button id="addStreamNoticeBtn" class="secondary-btn" type="button">＋ Notice</button></div>
</div>
<div id="xpostEditor" hidden>
  <div class="chat-options two-col"><label><span>Thread label <em>optional</em></span><input id="xThreadLabel" type="text" placeholder="Thread" maxlength="80" /></label><label class="toggle-field"><span>Show X mark</span><input id="xShowMark" type="checkbox" checked /></label></div>
  <div id="xList" class="message-list"></div>
  <div class="button-row"><button id="addXPostBtn" type="button">＋ Post / Reply</button></div>
</div>
</section>
<section class="panel preview-panel"><div class="section-heading"><div><p class="eyebrow">Live</p><h2>Preview</h2></div></div><div class="preview-frame"><div id="preview"></div></div></section>
<section class="panel output-panel"><div class="button-row"><button id="copyHtmlBtn" class="primary-btn" type="button">Copy HTML</button><button id="copyJsonBtn" class="secondary-btn" type="button">Copy JSON</button><button id="clearBtn" class="danger-btn" type="button">Clear</button></div><p id="status" class="status" aria-live="polite"></p><details><summary>Generated HTML</summary><textarea id="htmlOutput" readonly spellcheck="false"></textarea></details></section>
</main>

<template id="messageEditorTemplate"><article class="editor-card"><div class="editor-card-top"><div><span class="type-pill">Text</span><div class="segmented side-control" style="margin-top:8px"><button type="button" data-side="left">Left</button><button type="button" data-side="right">Right</button></div></div><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><label><span>Sender <em>optional</em></span><input class="sender-input" type="text" placeholder="Wei" maxlength="60" /></label><label><span>Message</span><textarea class="text-input" rows="3" placeholder="Still at the studio?"></textarea></label><label class="receipt-wrap"><span>iMessage receipt <em>outgoing only</em></span><select class="receipt-input"><option value="">None</option><option value="Delivered">Delivered</option><option value="Read">Read</option></select></label></article></template>
<template id="voiceEditorTemplate"><article class="editor-card"><div class="editor-card-top"><div><span class="type-pill">WeChat voice</span><div class="segmented side-control" style="margin-top:8px"><button type="button" data-side="left">Left</button><button type="button" data-side="right">Right</button></div></div><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><label><span>Sender <em>optional</em></span><input class="sender-input" type="text" placeholder="Wei" maxlength="60" /></label><div class="two-col"><label><span>Duration (seconds)</span><input class="duration-input" type="number" inputmode="numeric" min="1" max="60" step="1" /></label><label><span>Transcript / meaning <em>for the model</em></span><input class="text-input" type="text" placeholder="Come downstairs. I'm outside." /></label></div></article></template>
<template id="stickerEditorTemplate"><article class="editor-card"><div class="editor-card-top"><div><span class="type-pill">WeChat sticker</span><div class="segmented side-control" style="margin-top:8px"><button type="button" data-side="left">Left</button><button type="button" data-side="right">Right</button></div></div><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><label><span>Sender <em>optional</em></span><input class="sender-input" type="text" placeholder="Wei" maxlength="60" /></label><label><span>Sticker <em>emoji/text or image URL</em></span><input class="sticker-input" type="text" placeholder="😤 or https://.../sticker.png" /></label><label><span>Alt / meaning <em>for the model</em></span><input class="text-input" type="text" placeholder="annoyed pout sticker" /></label></article></template>
<template id="separatorEditorTemplate"><article class="editor-card separator-editor"><div class="editor-card-top"><strong>Time / separator</strong><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><label><span>Label</span><input class="separator-input" type="text" placeholder="Today 10:42 PM" maxlength="80" /></label></article></template>
<template id="streamMessageEditorTemplate"><article class="editor-card"><div class="editor-card-top"><span class="type-pill">Chat message</span><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><div class="two-col"><label><span>Username</span><input class="sender-input" type="text" placeholder="viewer123" maxlength="60" /></label><label><span>Badge</span><select class="badge-input"><option value="">None</option><option value="MOD">MOD</option><option value="SUB">SUB</option><option value="VIP">VIP</option></select></label></div><label><span>Message</span><textarea class="text-input" rows="2" placeholder="WAIT DID HE JUST SAY THAT"></textarea></label></article></template>
<template id="donationEditorTemplate"><article class="editor-card"><div class="editor-card-top"><span class="type-pill">Highlighted donation</span><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><div class="two-col"><label><span>Username</span><input class="sender-input" type="text" placeholder="peachmilk" maxlength="60" /></label><label><span>Amount</span><input class="amount-input" type="text" placeholder="$10.00" maxlength="40" /></label></div><label><span>Message</span><textarea class="text-input" rows="2" placeholder="PLEASE ASK HIM ABOUT THE SONG"></textarea></label></article></template>
<template id="xPostEditorTemplate"><article class="editor-card"><div class="editor-card-top"><span class="type-pill">Post / reply</span><div class="mini-actions"><button type="button" class="icon-btn duplicate-item">⧉</button><button type="button" class="icon-btn move-up">↑</button><button type="button" class="icon-btn move-down">↓</button><button type="button" class="icon-btn delete-item">×</button></div></div><div class="two-col"><label><span>Display name</span><input class="author-input" type="text" placeholder="Wei" maxlength="80" /></label><label><span>Handle</span><input class="handle-input" type="text" placeholder="@wei" maxlength="80" /></label></div><label><span>Post</span><textarea class="text-input" rows="4" placeholder="some of you need to sleep"></textarea></label><div class="two-col"><label><span>Timestamp</span><input class="timestamp-input" type="text" placeholder="1:48 AM · Oct 6, 2026" maxlength="100" /></label><label class="toggle-field"><span>Verified</span><input class="verified-input" type="checkbox" /></label></div><div class="stats-grid"><label><span>Replies</span><input class="replies-input" inputmode="numeric" type="number" min="0" step="1" /></label><label><span>Reposts</span><input class="reposts-input" inputmode="numeric" type="number" min="0" step="1" /></label><label><span>Likes</span><input class="likes-input" inputmode="numeric" type="number" min="0" step="1" /></label></div></article></template>

<script>
(function(){
const esc=(v='')=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const nl=(v='')=>esc(v).replace(/\n/g,'<br>');
const fmt=n=>{n=Math.max(0,Number(n)||0);if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+'M';if(n>=1e3)return(n/1e3).toFixed(n>=1e4?0:1).replace('.0','')+'K';return String(Math.floor(n))};
const sem=text=>text?.trim()?`<span style="display:none;">${esc(text.trim())}</span>`:'';
function shell(inner,style){return `<div style="${style}">${inner}</div>`}
function header(show,title,appName,style){return show?`<div style="${style}">${esc(title?.trim()||appName)}</div>`:''}
function validItems(items){return (items||[]).filter(Boolean)}
function chatSender(item,right,repeat){return item.sender?.trim()&&!repeat?`<div style="font-size:11px;color:#8f9499;margin:0 5px 4px;${right?'text-align:right;':''}">${esc(item.sender.trim())}</div>`:''}
function renderWechat(chat){
 const items=validItems(chat.items);let body='';
 items.forEach((item,i)=>{if(item.type==='separator'){if(item.text?.trim())body+=`<div style="text-align:center;margin:16px 0 12px;color:#94999e;font-size:12px;line-height:1.4;">${esc(item.text)}</div>`;return}
 const right=item.side==='right',prev=items[i-1],repeat=prev&&prev.type===item.type&&prev.side===item.side&&(prev.sender||'')===(item.sender||'');const sender=chatSender(item,right,repeat);
 if(item.type==='voice'){
  const secs=Math.max(1,Math.min(60,Number(item.duration)||1));const width=Math.min(190,76+secs*2.2);const waves=right?'◖)))':'(((◗';const transcript=item.text?.trim()||'';
  const transcriptBlock=transcript?`<div style="margin-top:5px;background:#fff;border:1px solid #dedede;border-radius:7px;padding:8px 10px;color:#333;font-size:12px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.025);"><div style="color:#969696;font-size:10px;margin-bottom:3px;">Transcript</div>${nl(transcript)}</div>`:'';
  body+=`<div style="display:flex;justify-content:${right?'flex-end':'flex-start'};margin:${repeat?'5':'11'}px 0 0;"><div style="max-width:78%;">${sender}<details style="margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;"><summary style="list-style:none!important;cursor:pointer!important;margin:0!important;padding:0!important;border:0!important;outline:0!important;background:transparent!important;box-shadow:none!important;border-radius:0!important;color:inherit!important;font:inherit!important;line-height:normal!important;appearance:none!important;-webkit-appearance:none!important;display:block!important;width:auto!important;height:auto!important;min-width:0!important;min-height:0!important;user-select:none!important;"><span style="display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;width:${width}px!important;box-sizing:border-box!important;background:${right?'#95ec69':'#fff'}!important;border:1px solid ${right?'#82dc58':'#e2e2e2'}!important;border-radius:7px!important;padding:9px 11px!important;color:#171717!important;font-family:Arial,Helvetica,sans-serif!important;font-size:14px!important;font-weight:400!important;font-style:normal!important;line-height:1.35!important;text-decoration:none!important;text-transform:none!important;letter-spacing:normal!important;box-shadow:0 1px 1px rgba(0,0,0,.035)!important;"><span>${right?`${secs}″`:waves}</span><span>${right?waves:`${secs}″`}</span></span></summary>${transcriptBlock}</details>${sem(`Voice message${transcript?`: ${transcript}`:''}`)}</div></div>`;return;
 }
 if(item.type==='sticker'){
  const raw=(item.sticker||'').trim(),isUrl=/^https?:\/\//i.test(raw);const visual=isUrl?`<img src="${esc(raw)}" alt="${esc(item.text||'sticker')}" style="display:block;max-width:128px;max-height:128px;object-fit:contain;border-radius:8px;">`:`<div style="font-size:52px;line-height:1.05;max-width:140px;word-break:break-word;">${esc(raw||'🙂')}</div>`;
  body+=`<div style="display:flex;justify-content:${right?'flex-end':'flex-start'};margin:${repeat?'5':'11'}px 0 0;"><div>${sender}${visual}${sem(`Sticker${item.text?.trim()?`: ${item.text.trim()}`:''}`)}</div></div>`;return;
 }
 if(!item.text?.trim())return;body+=`<div style="display:flex;justify-content:${right?'flex-end':'flex-start'};margin:${repeat?'5':'11'}px 0 0;"><div style="max-width:78%;min-width:0;">${sender}<div style="background:${right?'#95ec69':'#fff'};border:1px solid ${right?'#82dc58':'#e2e2e2'};border-radius:7px;padding:9px 11px;color:#171717;font-size:14px;line-height:1.52;word-break:break-word;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.035);">${nl(item.text)}</div></div></div>`});
 const h=header(chat.showHeader,chat.title,'WeChat','background:#f7f7f7;border-bottom:1px solid #d8d8d8;padding:12px 14px;text-align:center;font-size:14px;font-weight:650;');
 return shell(`${h}<div style="padding:12px 14px 18px;background:#ededed;">${body||'<div style="text-align:center;color:#999;padding:28px 10px;font-size:13px;">No messages yet.</div>'}</div>`,`width:100%;max-width:520px;margin:0 auto;background:#ededed;border:1px solid #d7d7d7;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#181818;box-shadow:0 8px 24px rgba(0,0,0,.08);`)
}
function renderIMessage(chat){
 const items=validItems(chat.items);let body='';
 items.forEach((item,i)=>{if(item.type==='separator'){if(item.text?.trim())body+=`<div style="text-align:center;margin:16px 0 9px;color:#8e8e93;font-size:11px;font-weight:500;">${esc(item.text)}</div>`;return}
 const right=item.side==='right',prev=items[i-1],repeat=prev&&prev.type===item.type&&prev.side===item.side&&(prev.sender||'')===(item.sender||'');const sender=item.sender?.trim()&&!repeat?`<div style="font-size:10px;color:#8e8e93;margin:0 9px 3px;${right?'text-align:right;':''}">${esc(item.sender.trim())}</div>`:'';
 if(item.type==='voice'||item.type==='sticker'){const label=item.type==='voice'?`Voice message · ${Math.max(1,Number(item.duration)||1)}s${item.text?.trim()?` — ${item.text.trim()}`:''}`:`Sticker${item.text?.trim()?` — ${item.text.trim()}`:''}`;body+=`<div style="display:flex;justify-content:${right?'flex-end':'flex-start'};margin:8px 0 0;"><div style="max-width:79%;">${sender}<div style="background:${right?'#0b84fe':'#e9e9eb'};color:${right?'#fff':'#111'};border-radius:18px;padding:8px 12px;font-size:13px;font-style:italic;">${esc(label)}</div></div></div>`;return}
 if(!item.text?.trim())return;const receipt=right&&item.receipt?`<div style="font-size:9px;color:#8e8e93;text-align:right;margin:3px 8px 0;">${esc(item.receipt)}</div>`:'';
 body+=`<div style="display:flex;justify-content:${right?'flex-end':'flex-start'};margin:${repeat?'3':'8'}px 0 0;"><div style="max-width:79%;">${sender}<div style="background:${right?'#0b84fe':'#e9e9eb'};color:${right?'#fff':'#111'};border-radius:18px;padding:8px 12px;font-size:14px;line-height:1.42;word-break:break-word;overflow-wrap:anywhere;">${nl(item.text)}</div>${receipt}</div></div>`});
 const h=header(chat.showHeader,chat.title,'Messages','background:#f7f7f8;border-bottom:1px solid #e5e5e7;padding:11px 14px;text-align:center;font-size:14px;font-weight:650;');return shell(`${h}<div style="padding:12px 13px 18px;background:#fff;">${body||'<div style="text-align:center;color:#999;padding:28px 10px;font-size:13px;">No messages yet.</div>'}</div>`,`width:100%;max-width:520px;margin:0 auto;background:#fff;border:1px solid #d9d9dc;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.08);`)
}
function badge(label){if(!label)return'';const bg={MOD:'#00ad03',SUB:'#9147ff',VIP:'#e91916'}[label]||'#6b7280';return `<span style="display:inline-block;background:${bg};color:#fff;border-radius:3px;padding:1px 4px;margin-right:4px;font-size:9px;font-weight:850;vertical-align:1px;">${esc(label)}</span>`}
function renderStream(stream){const palette=['#ad7fff','#00a8fc','#ff75a0','#52c780','#f5a623','#e96dff'];let body='';validItems(stream.items).forEach(item=>{if(item.type==='separator'){if(item.text?.trim())body+=`<div style="margin:10px 0;color:#8d8f98;font-size:11px;text-align:center;">${esc(item.text)}</div>`;return}const name=item.sender?.trim()||'viewer',color=palette[Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length];if(item.type==='donation'){body+=`<div style="margin:9px 0;border-radius:7px;overflow:hidden;background:#9147ff;color:#fff;"><div style="display:flex;justify-content:space-between;gap:10px;padding:7px 9px;background:rgba(0,0,0,.16);font-size:11px;font-weight:800;"><span>${esc(name)}</span><span>${esc(item.amount||'$5.00')}</span></div><div style="padding:9px;font-size:13px;line-height:1.4;">${nl(item.text||'')}</div></div>`;return}if(!item.text?.trim())return;body+=`<div style="font-size:13px;line-height:1.45;margin:5px 0;word-break:break-word;overflow-wrap:anywhere;">${badge(item.badge)}<span style="font-weight:800;color:${color};">${esc(name)}</span><span style="color:#8d8f98;">: </span><span style="color:#efeff1;">${nl(item.text)}</span></div>`});const title=esc(stream.title?.trim()||'LIVE CHAT'),viewerText=stream.viewers?`<span style="font-weight:650;color:#efeff1;">${fmt(stream.viewers)} watching</span>`:'';return shell(`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:#18181b;border-bottom:1px solid #303036;padding:11px 13px;"><div style="font-size:12px;font-weight:850;letter-spacing:.04em;color:#efeff1;">${title}</div>${viewerText}</div><div style="padding:10px 12px 14px;background:#1f1f23;">${body||'<div style="text-align:center;color:#8d8f98;padding:28px 10px;font-size:13px;">Chat is quiet.</div>'}</div>`,`width:100%;max-width:520px;margin:0 auto;background:#1f1f23;border:1px solid #303036;border-radius:10px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.16);`)}
function renderX(thread){const posts=validItems(thread.items).filter(p=>p.text?.trim());const rows=posts.map((p,i)=>{const verified=p.verified?`<span style="display:inline-flex;align-items:center;justify-content:center;margin-left:4px;width:15px;height:15px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:10px;font-weight:900;vertical-align:1px;">✓</span>`:'';const stats=`<div style="display:flex;gap:17px;flex-wrap:wrap;margin-top:10px;color:#536471;font-size:11px;"><span><b style="color:#0f1419;">${fmt(p.replies)}</b> replies</span><span><b style="color:#0f1419;">${fmt(p.reposts)}</b> reposts</span><span><b style="color:#0f1419;">${fmt(p.likes)}</b> likes</span></div>`;const line=i<posts.length-1?'<div style="position:absolute;left:20px;top:47px;bottom:-10px;width:2px;background:#cfd9de;"></div>':'';return `<div style="position:relative;padding:13px 14px ${i<posts.length-1?'7':'14'}px;${i?'border-top:1px solid #eff3f4;':''}">${line}<div style="display:flex;gap:10px;align-items:flex-start;"><div style="position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:#d9e0e5;display:flex;align-items:center;justify-content:center;color:#536471;font-size:16px;font-weight:800;flex:0 0 42px;">${esc((p.author?.trim()||'U').slice(0,1).toUpperCase())}</div><div style="min-width:0;flex:1;"><div style="font-size:14px;line-height:1.2;"><b style="color:#0f1419;">${esc(p.author?.trim()||'User')}</b>${verified}<span style="color:#536471;margin-left:5px;">${esc(p.handle?.trim()||'@user')}</span></div>${p.timestamp?.trim()?`<div style="color:#536471;font-size:11px;margin-top:2px;">${esc(p.timestamp)}</div>`:''}<div style="margin-top:7px;color:#0f1419;font-size:15px;line-height:1.45;word-break:break-word;overflow-wrap:anywhere;">${nl(p.text)}</div>${stats}</div></div></div>`}).join('');const top=thread.label?.trim()?`<div style="padding:10px 14px;border-bottom:1px solid #eff3f4;font-size:12px;font-weight:800;color:#0f1419;display:flex;justify-content:space-between;"><span>${esc(thread.label)}</span>${thread.showMark!==false?'<span style="font-size:17px;">𝕏</span>':''}</div>`:'';return shell(`${top}${rows||'<div style="padding:28px 14px;text-align:center;color:#536471;font-size:13px;">No posts yet.</div>'}`,`width:100%;max-width:560px;margin:0 auto;background:#fff;border:1px solid #cfd9de;border-radius:15px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#0f1419;box-shadow:0 8px 24px rgba(0,0,0,.07);`)}
window.IMMRenderers={wechat:renderWechat,imessage:renderIMessage,stream:renderStream,xpost:renderX};
})();
</script>
<script>
const STORAGE_KEY='immersive-message-maker-v4';const CHAT_PRESETS=new Set(['wechat','imessage']);const PRESET_HINTS={wechat:'Private chat with text, voice messages, stickers, and timestamps.',imessage:'Private chat with blue/gray bubbles and optional Delivered / Read receipts.',stream:'Twitch-ish live chat with badges, notices, viewer count, and highlighted donations.',xpost:'A multi-post X-style thread with replies and per-post engagement.'};
const exampleChat={title:'Wei',showHeader:true,items:[{type:'separator',text:'Today 10:42 PM'},{type:'message',side:'left',sender:'Wei',text:'Still at the studio?',receipt:''},{type:'message',side:'right',sender:'',text:'Yeah, wrapping up now.',receipt:'Delivered'},{type:'voice',side:'left',sender:'Wei',duration:6,text:'Eat something before you leave.'},{type:'sticker',side:'right',sender:'',sticker:'🫡',text:'saluting / understood'}]};
const exampleStream={title:'LIVE CHAT',viewers:1247,items:[{type:'message',sender:'peachmilk',badge:'SUB',text:'WAIT DID HE JUST SAY THAT'},{type:'message',sender:'wei_fan92',badge:'',text:'clip it clip it clip it'},{type:'donation',sender:'mossycat',amount:'$20.00',text:'PLEASE ASK HIM ABOUT THE NEW SONG 😭'},{type:'message',sender:'nightshift',badge:'MOD',text:'chat behave'}]};
const exampleX={label:'Thread',showMark:true,items:[{type:'post',author:'Wei',handle:'@wei',text:'some of you need to sleep',timestamp:'1:48 AM · Oct 6, 2026',verified:false,replies:12,reposts:38,likes:417},{type:'post',author:'Moss',handle:'@mossycat',text:'you are literally posting this at 1:48am',timestamp:'1:49 AM · Oct 6, 2026',verified:false,replies:3,reposts:9,likes:182},{type:'post',author:'Wei',handle:'@wei',text:'irrelevant',timestamp:'1:50 AM · Oct 6, 2026',verified:false,replies:8,reposts:21,likes:306}]};
const defaultState={preset:'wechat',chat:exampleChat,stream:exampleStream,xpost:exampleX};
const $=s=>document.querySelector(s),messageList=$('#messageList'),streamList=$('#streamList'),xList=$('#xList'),preview=$('#preview'),htmlOutput=$('#htmlOutput'),statusEl=$('#status');let state=loadState();
const templates={message:$('#messageEditorTemplate'),voice:$('#voiceEditorTemplate'),sticker:$('#stickerEditorTemplate'),separator:$('#separatorEditorTemplate'),streamMessage:$('#streamMessageEditorTemplate'),donation:$('#donationEditorTemplate'),xpost:$('#xPostEditorTemplate')};
function clone(v){return JSON.parse(JSON.stringify(v))}function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return clone(defaultState);const p=JSON.parse(raw);return {...clone(defaultState),...p,chat:{...clone(exampleChat),...(p.chat||{})},stream:{...clone(exampleStream),...(p.stream||{})},xpost:{...clone(exampleX),...(p.xpost||{})}}}catch{return clone(defaultState)}}function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch{}}function mode(){return CHAT_PRESETS.has(state.preset)?'chat':state.preset}function generatedHtml(){return window.IMMRenderers[state.preset]?.(state[mode()])||''}function exportJson(){const m=mode(),types={chat:'chat',stream:'stream_chat',xpost:'social_thread'};return{schemaVersion:4,preset:state.preset,content:{type:types[m],...state[m]}}}
function renderMode(){$('#preset').value=state.preset;$('#presetHint').textContent=PRESET_HINTS[state.preset]||'';const m=mode();['chat','stream','xpost'].forEach(n=>$('#'+n+'Editor').hidden=n!==m);$('#editorTitle').textContent={chat:'Messages',stream:'Stream Chat',xpost:'X Thread'}[m];if(m==='chat'){$('#chatTitle').value=state.chat.title||'';$('#showHeader').checked=state.chat.showHeader!==false;$('#chatSpecialHint').textContent=state.preset==='wechat'?'Voice and sticker items render natively in WeChat. Their transcript/alt text is hidden in the HTML for model readability.':'Delivered / Read receipts appear on outgoing text messages. WeChat-only voice/sticker items fall back to readable message bubbles here.';renderChatEditor()}else if(m==='stream'){ $('#streamTitle').value=state.stream.title||'';$('#streamViewers').value=state.stream.viewers??0;renderStreamEditor()}else{ $('#xThreadLabel').value=state.xpost.label||'';$('#xShowMark').checked=state.xpost.showMark!==false;renderXEditor()}}
function addActions(card,items,index,item){const up=card.querySelector('.move-up'),down=card.querySelector('.move-down');up.disabled=index===0;down.disabled=index===items.length-1;up.onclick=()=>moveItem(items,index,-1);down.onclick=()=>moveItem(items,index,1);card.querySelector('.delete-item').onclick=()=>{items.splice(index,1);commit(true)};card.querySelector('.duplicate-item').onclick=()=>{items.splice(index+1,0,clone(item));commit(true)}}
function bindSides(card,item){card.querySelectorAll('[data-side]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.side===item.side);btn.onclick=()=>{item.side=btn.dataset.side;commit(true)}})}
function renderChatEditor(){messageList.innerHTML='';const items=state.chat.items||[];if(!items.length)messageList.innerHTML='<div class="empty-state">Nothing here yet. Add something below ✨</div>';items.forEach((item,index)=>{let t=templates[item.type]||templates.message;const frag=t.content.cloneNode(true),card=frag.querySelector('.editor-card');addActions(card,items,index,item);if(item.type==='separator'){const x=card.querySelector('.separator-input');x.value=item.text||'';x.oninput=e=>{item.text=e.target.value;softCommit()}}else{bindSides(card,item);const sender=card.querySelector('.sender-input');sender.value=item.sender||'';sender.oninput=e=>{item.sender=e.target.value;softCommit()};const text=card.querySelector('.text-input');if(text){text.value=item.text||'';text.oninput=e=>{item.text=e.target.value;softCommit()}}if(item.type==='message'){const rec=card.querySelector('.receipt-input');rec.value=item.receipt||'';rec.onchange=e=>{item.receipt=e.target.value;softCommit()};card.querySelector('.receipt-wrap').style.display=state.preset==='imessage'?'block':'none'}if(item.type==='voice'){const d=card.querySelector('.duration-input');d.value=item.duration||1;d.oninput=e=>{item.duration=Math.max(1,Math.min(60,Number(e.target.value)||1));softCommit()}}if(item.type==='sticker'){const s=card.querySelector('.sticker-input');s.value=item.sticker||'';s.oninput=e=>{item.sticker=e.target.value;softCommit()}}}messageList.appendChild(frag)})}
function renderStreamEditor(){streamList.innerHTML='';const items=state.stream.items||[];if(!items.length)streamList.innerHTML='<div class="empty-state">Chat is empty. Add a message or donation ✨</div>';items.forEach((item,index)=>{let t=item.type==='donation'?templates.donation:item.type==='separator'?templates.separator:templates.streamMessage;const frag=t.content.cloneNode(true),card=frag.querySelector('.editor-card');addActions(card,items,index,item);if(item.type==='separator'){const x=card.querySelector('.separator-input');x.value=item.text||'';x.oninput=e=>{item.text=e.target.value;softCommit()}}else{const sender=card.querySelector('.sender-input'),text=card.querySelector('.text-input');sender.value=item.sender||'';text.value=item.text||'';sender.oninput=e=>{item.sender=e.target.value;softCommit()};text.oninput=e=>{item.text=e.target.value;softCommit()};if(item.type==='donation'){const a=card.querySelector('.amount-input');a.value=item.amount||'';a.oninput=e=>{item.amount=e.target.value;softCommit()}}else{const b=card.querySelector('.badge-input');b.value=item.badge||'';b.onchange=e=>{item.badge=e.target.value;softCommit()}}}streamList.appendChild(frag)})}
function renderXEditor(){xList.innerHTML='';const items=state.xpost.items||[];if(!items.length)xList.innerHTML='<div class="empty-state">No posts yet. Start the thread ✨</div>';items.forEach((item,index)=>{const frag=templates.xpost.content.cloneNode(true),card=frag.querySelector('.editor-card');addActions(card,items,index,item);[['.author-input','author'],['.handle-input','handle'],['.text-input','text'],['.timestamp-input','timestamp']].forEach(([sel,key])=>{const el=card.querySelector(sel);el.value=item[key]||'';el.oninput=e=>{item[key]=e.target.value;softCommit()}});const v=card.querySelector('.verified-input');v.checked=!!item.verified;v.onchange=e=>{item.verified=e.target.checked;softCommit()};[['.replies-input','replies'],['.reposts-input','reposts'],['.likes-input','likes']].forEach(([sel,key])=>{const el=card.querySelector(sel);el.value=item[key]??0;el.oninput=e=>{item[key]=Math.max(0,Number(e.target.value)||0);softCommit()}});xList.appendChild(frag)})}
function renderPreview(){const html=generatedHtml();preview.innerHTML=html;htmlOutput.value=html}function softCommit(){saveState();renderPreview()}function commit(re=false){saveState();if(re)renderMode();renderPreview()}function moveItem(items,index,d){const t=index+d;if(t<0||t>=items.length)return;[items[index],items[t]]=[items[t],items[index]];commit(true)}function flashStatus(msg){statusEl.textContent=msg;clearTimeout(flashStatus.t);flashStatus.t=setTimeout(()=>statusEl.textContent='',2200)}async function copyText(text,msg){try{await navigator.clipboard.writeText(text);flashStatus(msg)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');flashStatus(msg+' (fallback copy)')}catch{flashStatus('Could not copy automatically — open Generated HTML and copy manually.')}ta.remove()}}
$('#preset').onchange=e=>{state.preset=e.target.value;commit(true)};$('#chatTitle').oninput=e=>{state.chat.title=e.target.value;softCommit()};$('#showHeader').onchange=e=>{state.chat.showHeader=e.target.checked;softCommit()};$('#streamTitle').oninput=e=>{state.stream.title=e.target.value;softCommit()};$('#streamViewers').oninput=e=>{state.stream.viewers=Math.max(0,Number(e.target.value)||0);softCommit()};$('#xThreadLabel').oninput=e=>{state.xpost.label=e.target.value;softCommit()};$('#xShowMark').onchange=e=>{state.xpost.showMark=e.target.checked;softCommit()};
$('#addMessageBtn').onclick=()=>{state.chat.items.push({type:'message',side:'left',sender:'',text:'',receipt:''});commit(true)};$('#addVoiceBtn').onclick=()=>{state.chat.items.push({type:'voice',side:'left',sender:'',duration:4,text:''});commit(true)};$('#addStickerBtn').onclick=()=>{state.chat.items.push({type:'sticker',side:'left',sender:'',sticker:'🙂',text:''});commit(true)};$('#addSeparatorBtn').onclick=()=>{state.chat.items.push({type:'separator',text:'Today'});commit(true)};$('#addStreamMessageBtn').onclick=()=>{state.stream.items.push({type:'message',sender:'viewer',badge:'',text:''});commit(true)};$('#addDonationBtn').onclick=()=>{state.stream.items.push({type:'donation',sender:'viewer',amount:'$5.00',text:''});commit(true)};$('#addStreamNoticeBtn').onclick=()=>{state.stream.items.push({type:'separator',text:'Chat resumed'});commit(true)};$('#addXPostBtn').onclick=()=>{state.xpost.items.push({type:'post',author:'User',handle:'@user',text:'',timestamp:'',verified:false,replies:0,reposts:0,likes:0});commit(true)};
$('#loadExampleBtn').onclick=()=>{const m=mode();state[m]=clone({chat:exampleChat,stream:exampleStream,xpost:exampleX}[m]);commit(true);flashStatus('Example loaded.')};$('#copyHtmlBtn').onclick=()=>copyText(generatedHtml(),'HTML copied ✨');$('#copyJsonBtn').onclick=()=>copyText(JSON.stringify(exportJson(),null,2),'JSON copied.');$('#clearBtn').onclick=()=>{if(!confirm('Clear this content?'))return;const m=mode();if(m==='chat')state.chat={title:'',showHeader:true,items:[]};if(m==='stream')state.stream={title:'LIVE CHAT',viewers:0,items:[]};if(m==='xpost')state.xpost={label:'Thread',showMark:true,items:[]};commit(true);flashStatus('Cleared.')};renderMode();renderPreview();
</script>
